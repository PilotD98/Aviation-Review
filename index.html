<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recurrent">
<meta name="theme-color" content="#0B1120">
<meta name="description" content="Recurrent — an aviation knowledge refresher for returning pilots.">
<title>Recurrent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* ---------- Tokens ---------- */
:root {
  --bg: #0B1120;
  --bg-glow: rgba(242,181,68,0.10);
  --surface: rgba(19,28,46,0.82);
  --surface-solid: #131C2E;
  --raised: #1A2538;
  --line: rgba(173,190,220,0.14);
  --line-strong: rgba(173,190,220,0.28);
  --text: #E9EEF6;
  --text-2: #A9B4C7;
  --text-3: #6F7D96;
  --amber: #F2B544;
  --amber-ink: #1A1200;
  --amber-soft: rgba(242,181,68,0.16);
  --cyan: #4CC9D9;
  --cyan-soft: rgba(76,201,217,0.16);
  --good: #43D39B;
  --good-soft: rgba(67,211,155,0.18);
  --bad: #F26D6D;
  --bad-soft: rgba(242,109,109,0.18);
  --hard: #F2B544;
  --shadow: 0 10px 30px rgba(0,0,0,0.35);
  --nav-bg: rgba(11,17,32,0.86);
  --radius-card: 20px;
  --radius-btn: 14px;
  --font-display: "Bricolage Grotesque", "Avenir Next Condensed", "Helvetica Neue", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  --tab-h: 64px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F2F4F8;
    --bg-glow: rgba(242,181,68,0.22);
    --surface: rgba(255,255,255,0.78);
    --surface-solid: #FFFFFF;
    --raised: #FFFFFF;
    --line: rgba(20,30,55,0.10);
    --line-strong: rgba(20,30,55,0.22);
    --text: #141C2C;
    --text-2: #4A5569;
    --text-3: #7A849A;
    --amber: #A86B05;
    --amber-ink: #FFFFFF;
    --amber-soft: rgba(201,131,10,0.14);
    --cyan: #0E7F8E;
    --cyan-soft: rgba(14,127,142,0.12);
    --good: #138A5D;
    --good-soft: rgba(19,138,93,0.14);
    --bad: #C9403F;
    --bad-soft: rgba(201,64,63,0.12);
    --hard: #A86B05;
    --shadow: 0 10px 30px rgba(20,30,55,0.10);
    --nav-bg: rgba(242,244,248,0.88);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F2F4F8;
  --bg-glow: rgba(242,181,68,0.22);
  --surface: rgba(255,255,255,0.78);
  --surface-solid: #FFFFFF;
  --raised: #FFFFFF;
  --line: rgba(20,30,55,0.10);
  --line-strong: rgba(20,30,55,0.22);
  --text: #141C2C;
  --text-2: #4A5569;
  --text-3: #7A849A;
  --amber: #A86B05;
  --amber-ink: #FFFFFF;
  --amber-soft: rgba(201,131,10,0.14);
  --cyan: #0E7F8E;
  --cyan-soft: rgba(14,127,142,0.12);
  --good: #138A5D;
  --good-soft: rgba(19,138,93,0.14);
  --bad: #C9403F;
  --bad-soft: rgba(201,64,63,0.12);
  --hard: #A86B05;
  --shadow: 0 10px 30px rgba(20,30,55,0.10);
  --nav-bg: rgba(242,244,248,0.88);
  color-scheme: light;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(70% 40% at 50% -10%, var(--bg-glow), transparent 70%),
    var(--bg);
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.1; letter-spacing: -0.01em; }
h1 { font-size: 2rem; font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.app { display: flex; min-height: 100dvh; }
.sidenav { display: none; }
main {
  flex: 1; width: 100%; max-width: 720px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 20px) 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px);
}
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: space-around;
  padding: 6px 8px calc(env(safe-area-inset-bottom) + 6px);
  background: var(--nav-bg);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  min-height: 52px; padding: 6px 2px; border: 0; background: none; border-radius: 12px;
  color: var(--text-3); font-size: 0.72rem; font-weight: 500;
  transition: color .15s;
}
.tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--amber); }
@media (min-width: 900px) {
  .tabbar { display: none; }
  .sidenav {
    display: flex; flex-direction: column; gap: 4px;
    position: sticky; top: 0; height: 100dvh; width: 230px; flex-shrink: 0;
    padding: 28px 16px; border-right: 1px solid var(--line);
  }
  .sidenav .brand { font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; padding: 4px 12px 20px; color: var(--text); }
  .sidenav .brand small { display: block; font-family: var(--font-body); font-weight: 400; font-size: .78rem; color: var(--text-3); margin-top: 2px; }
  .sidenav .tab { flex: 0; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 11px 12px; font-size: .95rem; min-height: 44px; }
  .sidenav .tab[aria-current="page"] { background: var(--amber-soft); }
  .sidenav .spacer { flex: 1; }
  main { padding: 36px 32px 60px; }
}

/* ---------- Components ---------- */
.card {
  background: var(--surface);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 18px;
  box-shadow: var(--shadow);
}
.stack > * + * { margin-top: 14px; }
.section { margin-top: 28px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.muted { color: var(--text-2); }
.small { font-size: .85rem; }
.tiny { font-size: .75rem; color: var(--text-3); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 18px; border-radius: var(--radius-btn);
  border: 1px solid var(--line-strong); background: var(--raised); color: var(--text);
  font-weight: 500; text-decoration: none; transition: transform .12s, background .15s, border-color .15s;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--amber); color: var(--amber-ink); border-color: transparent; font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.lg { min-height: 58px; font-size: 1.05rem; font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.btn.hard { background: var(--amber-soft); border-color: var(--hard); color: var(--hard); }
.btn.cyan { background: var(--cyan-soft); border-color: var(--cyan); color: var(--cyan); }
.btn-row { display: flex; gap: 10px; }
.btn-row > .btn { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: transparent; color: var(--text-2);
  font-size: .9rem; transition: background .15s, color .15s, border-color .15s;
}
.chip[aria-pressed="true"] { background: var(--cyan-soft); border-color: var(--cyan); color: var(--cyan); font-weight: 500; }
.chip.amber[aria-pressed="true"] { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  background: var(--cyan-soft); color: var(--cyan); font-size: .78rem; font-weight: 500;
}
.pill code { font-family: inherit; opacity: .7; font-size: .72rem; }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--amber); transition: width .4s ease; }
.bar > i.cyan { background: var(--cyan); }
.bar > i.good { background: var(--good); }
.ring { display: block; }
.ring circle { fill: none; stroke-width: 3.5; }
.ring .ring-bg { stroke: var(--line); }
.ring .ring-fg { stroke: var(--amber); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .5s ease; }
.ring.complete .ring-fg { stroke: var(--good); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.empty { text-align: center; padding: 36px 16px; color: var(--text-2); }
.empty h2 { margin-bottom: 8px; color: var(--text); }
.notice { border-left: 3px solid var(--amber); padding: 10px 14px; background: var(--amber-soft); border-radius: 0 12px 12px 0; font-size: .9rem; }
.hr { height: 1px; background: var(--line); margin: 16px 0; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised);
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.kbd { font-family: var(--font-display); font-weight: 600; font-size: .8rem; color: var(--cyan); background: var(--cyan-soft); border-radius: 7px; min-width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
textarea, input[type="date"], input[type="text"], select {
  width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line-strong);
  background: var(--raised); color: var(--text); min-height: 44px;
}
textarea { resize: vertical; min-height: 88px; line-height: 1.5; }
input[type="date"] { -webkit-appearance: none; appearance: none; }
input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--amber); flex-shrink: 0; margin: 0; }

/* ---------- Home ---------- */
.home-head { padding: 6px 0 8px; }
.home-head .greet { color: var(--text-2); font-size: .95rem; }
.home-head h1 { margin-top: 2px; }
.due-card { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; margin-top: 18px; }
.due-num { font-family: var(--font-display); font-size: 3.2rem; font-weight: 700; line-height: 1; color: var(--amber); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.due-num.zero { color: var(--good); }
.due-label { color: var(--text-2); margin-top: 4px; }
.hero-actions { margin-top: 14px; display: grid; gap: 10px; }
.topic-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 600px) { .topic-grid { grid-template-columns: repeat(3, 1fr); } }
.topic-card {
  display: flex; flex-direction: column; gap: 10px; text-align: left; padding: 14px;
  border: 1px solid var(--line); border-radius: 16px; background: var(--surface);
  min-height: 108px; transition: border-color .15s, transform .12s;
}
.topic-card:active { transform: scale(.98); }
.topic-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.topic-card .name { font-family: var(--font-display); font-weight: 600; font-size: 1rem; line-height: 1.15; }
.topic-card .meta { font-size: .78rem; color: var(--text-3); margin-top: auto; }
.topic-card .meta b { color: var(--amber); font-weight: 600; }

/* ---------- Study ---------- */
.field { margin-top: 20px; }
.field > label, .field > .lbl { display: block; font-weight: 600; margin-bottom: 8px; font-family: var(--font-display); font-size: 1rem; }
.field .hint { font-size: .82rem; color: var(--text-3); margin-top: 6px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--raised); border: 1px solid var(--line); }
.seg button { min-height: 42px; border: 0; border-radius: 10px; background: transparent; color: var(--text-2); font-weight: 500; font-size: .92rem; }
.seg button[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink); font-weight: 600; }
.sticky-start { position: sticky; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); margin-top: 28px; padding: 12px 0 10px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
@media (min-width: 900px) { .sticky-start { bottom: 20px; } }

/* ---------- Session ---------- */
.session {
  position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
  background: var(--bg); overflow: hidden;
}
.session[hidden] { display: none; }
.session-top {
  display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
}
.session-top .prog { flex: 1; }
.session-top .count { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; }
.session-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 16px calc(env(safe-area-inset-bottom) + 24px); }
.session-inner { max-width: 680px; margin: 0 auto; }
.qcard {
  position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card);
  box-shadow: var(--shadow); padding: 22px 20px 20px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.qcard::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, var(--amber), transparent 60%); opacity: .9; }
.qcard .type-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .78rem; color: var(--text-3); margin-bottom: 12px; }
.qcard .type-line .topic { color: var(--cyan); font-weight: 500; }
.qtext { font-size: 1.12rem; line-height: 1.5; font-weight: 500; white-space: pre-line; }
.qtext.long { font-size: 1.02rem; font-weight: 400; }
.choices { margin-top: 18px; display: grid; gap: 10px; }
.choice {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  min-height: 54px; padding: 12px 14px; border-radius: var(--radius-btn);
  border: 1px solid var(--line-strong); background: var(--raised); color: var(--text);
  transition: border-color .15s, background .15s, transform .1s; line-height: 1.4;
}
.choice:not(:disabled):active { transform: scale(.985); }
.choice.correct { border-color: var(--good); background: var(--good-soft); }
.choice.correct .kbd { background: var(--good); color: #04120B; }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.wrong .kbd { background: var(--bad); color: #fff; }
.choice.dim { opacity: .5; }
.verdict { margin-top: 18px; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.exp { margin-top: 8px; color: var(--text-2); line-height: 1.55; white-space: pre-line; }
.srcline { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.session-actions { margin-top: 16px; display: grid; gap: 10px; }
.rate-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
.rate-row .btn { flex-direction: column; gap: 2px; min-height: 58px; padding: 8px 4px; font-size: .9rem; }
.rate-row .btn small { font-size: .68rem; opacity: .75; font-weight: 400; }
.flip-wrap { perspective: 1200px; margin-top: 4px; }
.flip { position: relative; transition: transform .5s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; cursor: pointer; }
.flip.flipped { transform: rotateY(180deg); }
.flip .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
/* The visible face sits in normal flow so the card grows to fit long answers;
   the hidden face is taken out of flow and clipped. */
.flip .face.back { transform: rotateY(180deg); }
.flip:not(.flipped) .face.back { position: absolute; inset: 0; overflow: hidden; }
.flip.flipped .face.front { position: absolute; inset: 0; overflow: hidden; }
.flip .face .lbl { font-size: .75rem; color: var(--text-3); margin-bottom: 8px; }
.flip .face .lbl.back-lbl { color: var(--cyan); }
.flip-hint { text-align: center; color: var(--text-3); font-size: .82rem; margin-top: 14px; }
.points { margin: 12px 0 0; padding-left: 0; list-style: none; display: grid; gap: 8px; }
.points li { display: flex; gap: 10px; align-items: flex-start; }
.points li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); margin-top: 9px; flex-shrink: 0; }
.oral-answer { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line-strong); }
.summary-score { font-family: var(--font-display); font-size: 3rem; font-weight: 700; line-height: 1; letter-spacing: -0.03em; color: var(--amber); }
.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.stat { padding: 12px; border-radius: 14px; background: var(--raised); border: 1px solid var(--line); }
.stat b { display: block; font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; line-height: 1.1; }
.stat span { font-size: .75rem; color: var(--text-3); }
.topic-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 8px 0; }
.topic-row .bar { grid-column: 1 / -1; }
.topic-row .num { font-variant-numeric: tabular-nums; font-size: .85rem; color: var(--text-2); }
.miss { padding: 10px 0; border-top: 1px solid var(--line); font-size: .9rem; }
.miss:first-child { border-top: 0; }
.miss .q { color: var(--text); }
.miss .t { color: var(--text-3); font-size: .78rem; }

/* ---------- Aircraft ---------- */
.ac-card h2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ac-card .sub { color: var(--text-2); font-size: .9rem; margin-top: 4px; }
.vtable { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: .9rem; }
.vtable th, .vtable td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.vtable th { font-weight: 500; color: var(--text-3); font-size: .78rem; border-top: 0; }
.vtable td.v { font-family: var(--font-display); font-weight: 600; white-space: nowrap; color: var(--cyan); }
.vtable td.k { font-family: var(--font-display); font-weight: 600; white-space: nowrap; }
.vtable td.m { color: var(--text-2); }
.kv { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 10px; font-size: .9rem; }
.kv div { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.kv div span:first-child { color: var(--text-3); }
.ac-section { margin-top: 18px; }
.ac-section h3 { margin-bottom: 4px; }

/* ---------- Checklist ---------- */
.ck { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.ck:first-child { border-top: 0; padding-top: 0; }
.ck label.t { font-weight: 600; font-family: var(--font-display); font-size: 1rem; display: block; }
.ck .reg { color: var(--cyan); font-size: .78rem; font-weight: 500; }
.ck .d { color: var(--text-2); font-size: .88rem; margin-top: 4px; }
.ck .date { margin-top: 10px; display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; font-size: .85rem; color: var(--text-3); }
.ck.done label.t { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--good); }

/* ---------- Stats ---------- */
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.type-row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); font-size: .9rem; }
.type-row:first-child { border-top: 0; }

/* =========================================================
   Storage
   ========================================================= */
function defaultStore() {
  return { theme: 'dark', items: {}, checklist: {}, notes: '', medical: '', sessions: 0 };
}
var store = defaultStore();
function load() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') store = Object.assign(defaultStore(), parsed);
      if (!store.items || typeof store.items !== 'object') store.items = {};
      if (!store.checklist || typeof store.checklist !== 'object') store.checklist = {};
    }
  } catch (e) { store = defaultStore(); }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* storage unavailable */ }
}

/* =========================================================
   Spaced repetition (SM-2 style)
   ========================================================= */
function newState() { return { ease: 2.5, interval: 0, reps: 0, due: 0, lapses: 0, seen: 0, correct: 0, last: 0 }; }
function gradeState(s, g, now) {
  s = Object.assign(newState(), s || {});
  now = now || Date.now();
  s.seen += 1; s.last = now;
  if (g === 'again') {
    s.reps = 0; s.interval = 0; s.due = now + 10 * 60 * 1000;
    s.ease = Math.max(1.3, s.ease - 0.2); s.lapses += 1;
    return s;
  }
  if (g === 'hard') {
    s.interval = Math.max(1, Math.round(s.interval * 1.2));
    s.ease = Math.max(1.3, s.ease - 0.15);
  } else if (g === 'good') {
    s.interval = s.reps === 0 ? 1 : (s.reps === 1 ? 3 : Math.round(s.interval * s.ease));
  } else { /* easy */
    s.interval = s.reps === 0 ? 3 : Math.round(s.interval * s.ease * 1.3);
    s.ease += 0.15;
  }
  s.reps += 1; s.correct += 1;
  s.due = now + s.interval * DAY;
  return s;
}
function stateOf(id) { return store.items[id] || null; }
function statusOf(id) {
  var s = stateOf(id);
  if (!s || !s.seen) return 'new';
  return s.interval >= 21 ? 'mastered' : 'learning';
}
function isDue(id, now) { var s = stateOf(id); return !!(s && s.seen && s.due <= (now || Date.now())); }
function applyGrade(id, g) { store.items[id] = gradeState(stateOf(id), g); save(); }

/* =========================================================
   Bank
   ========================================================= */
var BANK = [];
function loadBank() {
  var raw = (window.BANK && Array.isArray(window.BANK)) ? window.BANK : [];
  var seen = {};
  BANK = raw.filter(function (it) {
    if (!it || typeof it !== 'object' || !it.id || !it.type || !it.topic) return false;
    if (seen[it.id]) return false;
    seen[it.id] = true;
    if ((it.type === 'mcq' || it.type === 'scenario') && !(Array.isArray(it.choices) && it.choices.length)) return false;
    return true;
  });
}
function itemsByTopic(topic) { return BANK.filter(function (i) { return i.topic === topic; }); }
function hasTag(it, tag) { return Array.isArray(it.tags) && it.tags.indexOf(tag) !== -1; }
function dueCount() { var n = Date.now(); return BANK.filter(function (i) { return isDue(i.id, n); }).length; }

/* =========================================================
   Helpers
   ========================================================= */
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function pct(n, d) { return d ? Math.round(100 * n / d) : 0; }
function ring(p, size, cls) {
  size = size || 40;
  var r = (size - 5) / 2, c = 2 * Math.PI * r;
  return '<svg class="ring' + (p >= 100 ? ' complete' : '') + (cls ? ' ' + cls : '') + '" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">' +
    '<circle class="ring-bg" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '"/>' +
    '<circle class="ring-fg" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + (c * (1 - Math.min(100, Math.max(0, p)) / 100)).toFixed(2) + '"/></svg>';
}
function fmtTime(ms) {
  var s = Math.round(ms / 1000), m = Math.floor(s / 60); s = s % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function greeting() {
  var h = new Date().getHours();
  return h < 5 ? 'Late night' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
}
var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
}
function confirmDialog(title, body, okLabel) {
  return new Promise(function (resolve) {
    var m = document.getElementById('modal');
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').textContent = body;
    var ok = document.getElementById('modal-ok'), cancel = document.getElementById('modal-cancel');
    ok.textContent = okLabel || 'OK';
    m.hidden = false;
    var prev = document.activeElement;
    function done(v) { m.hidden = true; ok.onclick = cancel.onclick = null; document.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus(); resolve(v); }
    function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); done(false); } }
    ok.onclick = function () { done(true); };
    cancel.onclick = function () { done(false); };
    document.addEventListener('keydown', onKey);
    setTimeout(function () { cancel.focus(); }, 0);
  });
}
function topicProgress(topic) {
  var items = itemsByTopic(topic), mastered = 0, seen = 0;
  items.forEach(function (i) { var st = statusOf(i.id); if (st === 'mastered') mastered++; if (st !== 'new') seen++; });
  return { total: items.length, mastered: mastered, seen: seen, pct: pct(mastered, items.length) };
}

  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#0B1120' : '#F2F4F8');
}

function studyPool() {

}

/* =========================================================
   Sessions
   ========================================================= */
var session = null;

function orderSmart(pool, limit, now) {
  now = now || Date.now();
  var due = [], unseen = [], rest = [];
  pool.forEach(function (i) {
    var s = stateOf(i.id);
    if (!s || !s.seen) unseen.push(i);
    else if (s.due <= now) due.push(i);
    else rest.push(i);
  });
  due.sort(function (a, b) { return (stateOf(a.id).due || 0) - (stateOf(b.id).due || 0); });
  unseen = shuffle(unseen);
  rest.sort(function (a, b) { return (stateOf(a.id).due || 0) - (stateOf(b.id).due || 0); });
  var out = due.concat(unseen, rest);
  return limit ? out.slice(0, limit) : out;
}

function startSession(items, opts) {
  opts = opts || {};
  if (!items.length) { toast('Nothing matches that selection.'); return; }
  session = {
    queue: opts.keepOrder ? items.slice() : shuffle(items),
    idx: 0, results: [], requeued: {}, start: Date.now(),
    title: opts.title || 'Session', diagnostic: !!opts.diagnostic, phase: 'q', ui: {}
  };
  var el = document.getElementById('session');
  el.hidden = false;
  document.body.style.overflow = 'hidden';
  renderSession();
}

function startSmart(topic) {
  var pool = topic ? itemsByTopic(topic) : BANK;
  var items = orderSmart(pool, 20);
  startSession(items, { keepOrder: true, title: topic ? TOPIC_LABEL[topic] : 'Smart session' });
}
function startDiagnostic() {
  var pool = BANK.filter(function (i) { return i.type === 'mcq' || i.type === 'scenario'; });
  var unseen = shuffle(pool.filter(function (i) { return statusOf(i.id) === 'new'; }));
  var seen = shuffle(pool.filter(function (i) { return statusOf(i.id) !== 'new'; }));
  var items = unseen.concat(seen).slice(0, 20);
  startSession(shuffle(items), { keepOrder: true, title: 'Diagnostic', diagnostic: true });
}
function startStudy() {
  var pool = studyPool();
  var items;
  if (study.length === 'due') {
    items = orderSmart(pool.filter(function (i) { return isDue(i.id); }), 0);
    if (!items.length) { toast('Nothing is due for that selection yet.'); return; }
  } else {
    items = orderSmart(pool, Number(study.length));
  }
  startSession(items, { keepOrder: true, title: 'Study' });
}

function current() { return session.queue[session.idx]; }
function closeSession(force) {
  if (!session) return;
  var mid = session.phase !== 'summary' && session.idx > 0 && session.idx < session.queue.length;
  if (!force && mid) {
    confirmDialog('Leave this session?', 'Answers you have already given are saved. The remaining items stay where they are.', 'Leave').then(function (ok) { if (ok) closeSession(true); });
    return;
  }
  session = null;
  document.getElementById('session').hidden = true;
  document.body.style.overflow = '';
  render();
  var first = document.querySelector('#view h1');
  if (first) { first.setAttribute('tabindex', '-1'); first.focus(); }
}

function recordResult(item, grade, correct) {
  var first = !session.requeued[item.id];
  var r = { id: item.id, topic: item.topic, type: item.type, grade: grade, correct: correct, first: first };
  session.results.push(r);
  applyGrade(item.id, grade);
  if (grade === 'again' && !session.requeued[item.id]) {
    session.requeued[item.id] = true;
    session.queue.push(item);
  }
}
function nextItem() {
  session.idx += 1;
  session.phase = 'q';
  session.ui = {};
  if (session.idx >= session.queue.length) { session.phase = 'summary'; store.sessions = (store.sessions || 0) + 1; save(); }
  renderSession();
}

function renderSession() {
  if (!session) return;
  var inner = document.getElementById('session-inner');
  var N = session.queue.length;
  var n = Math.min(session.idx + 1, N);
  document.getElementById('session-count').textContent = session.phase === 'summary' ? 'Done' : n + ' / ' + N;
  document.getElementById('session-bar').style.width = (session.phase === 'summary' ? 100 : pct(session.idx, N)) + '%';
  if (session.phase === 'summary') { inner.innerHTML = summaryHtml(); document.querySelector('.session-body').scrollTop = 0; return; }
  var it = current();
  var again = session.requeued[it.id] ? '<span class="tiny">Again</span>' : '';
  var head = '<div class="type-line"><span class="topic">' + esc(TOPIC_LABEL[it.topic] || it.topic) + '</span><span>' + esc(TYPE_LABEL[it.type] || it.type) + ' ' + again + '</span></div>';
  var h = '';
  if (it.type === 'mcq' || it.type === 'scenario') h = mcqHtml(it, head);
  else if (it.type === 'card') h = cardHtml(it, head);
  else if (it.type === 'oral') h = oralHtml(it, head);
  else h = '<div class="qcard">' + head + '<p class="qtext">Unknown item type.</p></div><div class="session-actions"><button class="btn primary block" type="button" data-action="s-next">Next</button></div>';
  inner.innerHTML = h;
  document.querySelector('.session-body').scrollTop = 0;
}
function sourcePill(it) {
  return '<div class="srcline"><span class="pill">' + esc(it.ref || 'Source not listed') + ' <code>' + esc(it.id) + '</code></span></div>';
}
/* Choices are shuffled once per presentation so position can't be memorized.
   session.ui.order[displayIndex] = original index; ui.picked is an ORIGINAL index. */
function choiceOrder(it) {
  var ui = session.ui;
  if (!ui.order || ui.order.length !== (it.choices || []).length) {
    var o = (it.choices || []).map(function (_, i) { return i; });
    for (var i = o.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = o[i]; o[i] = o[j]; o[j] = t; }
    ui.order = o;
  }
  return ui.order;
}
function mcqHtml(it, head) {
  var ui = session.ui, picked = ui.picked;
  var order = choiceOrder(it);
  var long = (it.q || '').length > 220;
  var h = '<div class="qcard">' + head + '<p class="qtext' + (long ? ' long' : '') + '">' + esc(it.q || '(question missing)') + '</p><div class="choices">';
  order.forEach(function (orig, i) {
    var c = it.choices[orig];
    var cls = 'choice';
    if (picked !== undefined) {
      if (orig === it.a) cls += ' correct';
      else if (orig === picked) cls += ' wrong';
      else cls += ' dim';
    }
    h += '<button class="' + cls + '" type="button" data-action="s-pick" data-i="' + i + '"' + (picked !== undefined ? ' disabled' : '') + '><span class="kbd">' + 'ABCD'[i] + '</span><span>' + esc(c) + '</span></button>';
  });
  h += '</div>';
  if (picked !== undefined) {
    var ok = picked === it.a;
    var correctLetter = 'ABCD'[order.indexOf(it.a)];
    h += '<p class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? 'Correct' : 'Not quite — ' + correctLetter + ' is right') + '</p>';
    if (it.exp) h += '<p class="exp">' + esc(it.exp) + '</p>';
    h += sourcePill(it);
  }
  h += '</div>';
  if (picked !== undefined) h += '<div class="session-actions"><button class="btn primary lg block" type="button" data-action="s-next" id="s-next">Next</button></div>';
  return h;
}
function cardHtml(it, head) {
  var flipped = !!session.ui.flipped;
  var h = '<div class="flip-wrap"><div class="flip' + (flipped ? ' flipped' : '') + '" data-action="s-flip" role="button" tabindex="0" aria-label="Flashcard, tap to flip">' +
    '<div class="qcard face front">' + head + '<p class="lbl">Prompt</p><p class="qtext">' + esc(it.front || '(prompt missing)') + '</p></div>' +
    '<div class="qcard face back">' + head + '<p class="lbl back-lbl">Answer</p><p class="qtext">' + esc(it.back || '(answer missing)') + '</p>' + sourcePill(it) + '</div>' +
    '</div></div>';
  if (!flipped) h += '<p class="flip-hint">Tap the card or press Space to reveal</p>';
  else h += rateRow();
  return h;
}
function rateRow() {
  return '<div class="rate-row">' +
    '<button class="btn bad" type="button" data-action="s-rate" data-g="again">Again<small>1</small></button>' +
    '<button class="btn hard" type="button" data-action="s-rate" data-g="hard">Hard<small>2</small></button>' +
    '<button class="btn good" type="button" data-action="s-rate" data-g="good">Good<small>3</small></button>' +
    '<button class="btn cyan" type="button" data-action="s-rate" data-g="easy">Easy<small>4</small></button></div>';
}
function oralHtml(it, head) {
  var revealed = !!session.ui.revealed;
  var h = '<div class="qcard">' + head + '<p class="qtext">' + esc(it.q || '(question missing)') + '</p>';
  if (!revealed) {
    h += '<div class="field" style="margin-top:16px"><label for="oral-notes" class="small muted" style="font-family:var(--font-body);font-weight:400">Say it out loud or jot key points (not saved)</label><textarea id="oral-notes" rows="3"></textarea></div>';
  } else {
    h += '<div class="oral-answer"><p class="tiny" style="color:var(--cyan)">Model answer</p><p class="exp" style="color:var(--text)">' + esc(it.answer || '') + '</p>';

      h += '<p class="tiny" style="margin-top:14px">Key points to hit</p><ul class="points">' + it.points.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';

  else h += '<div class="session-actions"><div class="btn-row">' +
    '<button class="btn bad" type="button" data-action="s-rate" data-g="again">Needs work</button>' +
    '<button class="btn good" type="button" data-action="s-rate" data-g="good">Got it</button>' +
    '<button class="btn cyan" type="button" data-action="s-rate" data-g="easy">Nailed it</button></div></div>';
  return h;

function summaryHtml() {
  var res = session.results.filter(function (r) { return r.first; });
  var graded = res.filter(function (r) { return r.type === 'mcq' || r.type === 'scenario'; });
  var correct = graded.filter(function (r) { return r.correct; }).length;
  var missed = res.filter(function (r) { return r.grade === 'again'; });
  var elapsed = Date.now() - session.start;
  var byTopic = {};
  res.forEach(function (r) {
    var t = byTopic[r.topic] || (byTopic[r.topic] = { n: 0, ok: 0 });
    t.n++; if (r.grade !== 'again') t.ok++;
  });
  var h = '<div class="qcard"><p class="tiny" style="color:var(--cyan)">' + esc(session.title) + ' complete</p>';
  if (graded.length) h += '<div class="summary-score" style="margin-top:6px">' + pct(correct, graded.length) + '%</div><p class="muted">' + correct + ' of ' + graded.length + ' graded questions correct</p>';
  else h += '<div class="summary-score" style="margin-top:6px">' + res.length + '</div><p class="muted">items reviewed</p>';
  h += '<div class="summary-grid"><div class="stat"><b>' + fmtTime(elapsed) + '</b><span>time</span></div>' +
    '<div class="stat"><b>' + res.length + '</b><span>items</span></div>' +
    '<div class="stat"><b>' + missed.length + '</b><span>to revisit</span></div></div></div>';
  var topics = Object.keys(byTopic).sort(function (a, b) { return pct(byTopic[a].ok, byTopic[a].n) - pct(byTopic[b].ok, byTopic[b].n); });
  if (session.diagnostic && topics.length) {
    var weak = topics.filter(function (t) { return pct(byTopic[t].ok, byTopic[t].n) < 100; }).slice(0, 3);
    if (weak.length) {
      h += '<div class="card" style="margin-top:14px"><h3>Start with these</h3><p class="muted small" style="margin:4px 0 12px">Your weakest topics from this diagnostic. Tap one to study it.</p><div class="stack">';
      weak.forEach(function (t) {
        h += '<button class="btn block" type="button" data-action="s-topic" data-topic="' + t + '" style="justify-content:space-between">' + esc(TOPIC_LABEL[t] || t) + '<span class="muted small">' + byTopic[t].ok + ' / ' + byTopic[t].n + '</span></button>';
      });
      h += '</div></div>';
    } else {
      h += '<div class="card" style="margin-top:14px"><h3>Clean sweep</h3><p class="muted small" style="margin-top:4px">Nothing missed. Try a Smart session for depth.</p></div>';
    }
  }
  h += '<div class="card" style="margin-top:14px"><h3>By topic</h3>';
  topics.forEach(function (t) {
    var b = byTopic[t];
    h += '<div class="topic-row"><span>' + esc(TOPIC_LABEL[t] || t) + '</span><span class="num">' + b.ok + ' / ' + b.n + '</span><div class="bar"><i class="' + (b.ok === b.n ? 'good' : '') + '" style="width:' + pct(b.ok, b.n) + '%"></i></div></div>';
  });
  h += '</div>';
  if (missed.length) {
    h += '<div class="card" style="margin-top:14px"><h3>Missed</h3><div style="margin-top:8px">';
    missed.forEach(function (r) {
      var it = BANK.filter(function (i) { return i.id === r.id; })[0];
      var txt = it ? (it.q || it.front || '') : r.id;
      if (txt.length > 140) txt = txt.slice(0, 140) + '…';
      h += '<div class="miss"><div class="q">' + esc(txt) + '</div><div class="t">' + esc(TOPIC_LABEL[r.topic] || r.topic) + ' · ' + esc(r.id) + '</div></div>';
    });
    h += '</div></div>';
  }
  h += '<div class="session-actions">' +
    (missed.length ? '<button class="btn primary lg block" type="button" data-action="s-review-misses">Review misses (' + missed.length + ')</button>' : '') +
    '<button class="btn lg block' + (missed.length ? '' : ' primary') + '" type="button" data-action="s-done">Done</button></div>';
  return h;
}

/* ---- Session actions ---- */
function pick(i) {
  if (!session || session.phase !== 'q' || session.ui.picked !== undefined) return;
  var it = current();
  if (it.type !== 'mcq' && it.type !== 'scenario') return;
  if (i < 0 || i >= (it.choices || []).length) return;
  var orig = choiceOrder(it)[i];           // display index -> authored index
  session.ui.picked = orig;
  var ok = orig === it.a;
  recordResult(it, ok ? 'good' : 'again', ok);
  renderSession();
  var nb = document.getElementById('s-next'); if (nb) nb.focus({ preventScroll: true });
}
function flip() {
  if (!session || current().type !== 'card') return;
  session.ui.flipped = !session.ui.flipped;
  renderSession();
}
function reveal() {
  if (!session || current().type !== 'oral') return;
  session.ui.revealed = true;
  renderSession();
}
function rate(g) {
  if (!session) return;
  var it = current();
  if (it.type === 'card' && !session.ui.flipped) return;
  if (it.type === 'oral' && !session.ui.revealed) return;
  if (it.type !== 'card' && it.type !== 'oral') return;
  recordResult(it, g, g !== 'again');
  nextItem();
}
function reviewMisses() {
  var ids = {};
  session.results.forEach(function (r) { if (r.first && r.grade === 'again') ids[r.id] = true; });
  var items = BANK.filter(function (i) { return ids[i.id]; });
  session = null;
  startSession(items, { title: 'Review misses' });
}

/* =========================================================
   Export / import / reset
   ========================================================= */
function exportProgress() {
  try {
    var blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'recurrent-progress-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    toast('Progress exported');
  } catch (e) { toast('Export failed in this browser'); }
}
function importProgress(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var data = JSON.parse(reader.result);
      if (!data || typeof data !== 'object' || typeof data.items !== 'object') throw new Error('shape');
      confirmDialog('Replace progress?', 'This replaces everything saved on this device with the imported file.', 'Import').then(function (ok) {
        if (!ok) return;
        store = Object.assign(defaultStore(), data);
        save(); applyTheme(); render(); toast('Progress imported');
      });
    } catch (e) { toast('That file is not a Recurrent export.'); }
  };
  reader.readAsText(file);
}
function resetProgress() {
  confirmDialog('Reset all progress?', 'Scheduling, checklist, and notes on this device will be cleared. Export first if you want a copy.', 'Reset').then(function (ok) {
    if (!ok) return;
    var theme = store.theme;
    store = defaultStore(); store.theme = theme;
    save(); render(); toast('Progress reset');
  });
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-action]');
  if (!t) return;
  var a = t.getAttribute('data-action');
  switch (a) {
    case 'nav': go(t.getAttribute('data-view')); break;
    case 'toggle-theme': toggleTheme(); break;
    case 'set-theme': store.theme = t.getAttribute('data-v'); save(); applyTheme(); render(); break;
    case 'smart': startSmart(); break;
    case 'diagnostic': startDiagnostic(); break;
    case 'topic': startSmart(t.getAttribute('data-topic')); break;
    case 'study-mode': study.mode = t.getAttribute('data-v'); render(); break;
    case 'study-topic': {
      var v = t.getAttribute('data-v');
      if (v === 'all') study.topics = [];
      else { var ix = study.topics.indexOf(v); if (ix === -1) study.topics.push(v); else study.topics.splice(ix, 1); }
      render(); break;
    }
    case 'study-len': { var lv = t.getAttribute('data-v'); study.length = lv === 'due' ? 'due' : Number(lv); render(); break; }
    case 'study-tag': { var tv = t.getAttribute('data-v'); var ti = study.tags.indexOf(tv); if (ti === -1) study.tags.push(tv); else study.tags.splice(ti, 1); render(); break; }
    case 'study-start': startStudy(); break;
    case 'quiz-aircraft': {
      var tag = t.getAttribute('data-tag');
      startSession(orderSmart(BANK.filter(function (i) { return hasTag(i, tag); }), 20), { keepOrder: true, title: tag === 'c172' ? 'Cessna 172S' : 'PA-44 Seminole' });
      break;
    }
    case 'export': exportProgress(); break;
    case 'reset': resetProgress(); break;
    case 'session-close': closeSession(false); break;
    case 's-pick': pick(Number(t.getAttribute('data-i'))); break;
    case 's-next': nextItem(); break;
    case 's-flip': flip(); break;
    case 's-reveal': reveal(); break;
    case 's-rate': rate(t.getAttribute('data-g')); break;
    case 's-review-misses': reviewMisses(); break;
    case 's-done': closeSession(true); break;
    case 's-topic': { var tp = t.getAttribute('data-topic'); session = null; startSmart(tp); break; }
  }
});
document.addEventListener('change', function (e) {
  var t = e.target.closest('[data-action]');
  if (!t) return;
  var a = t.getAttribute('data-action');
  if (a === 'ck-done') {
    var id = t.getAttribute('data-id');
    store.checklist[id] = Object.assign({}, store.checklist[id], { done: t.checked });
    save();
    var row = t.closest('.ck'); if (row) row.classList.toggle('done', t.checked);
  } else if (a === 'ck-date') {
    var did = t.getAttribute('data-id');
    store.checklist[did] = Object.assign({}, store.checklist[did], { date: t.value });
    save();
  } else if (a === 'med-select') {
    store.medical = t.value; save(); render();
  } else if (a === 'import') {
    importProgress(t.files && t.files[0]); t.value = '';
  }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t && t.getAttribute && t.getAttribute('data-action') === 'notes') { store.notes = t.value; save(); }
});
document.addEventListener('keydown', function (e) {
  var tag = (e.target && e.target.tagName) || '';
  if (e.target && e.target.getAttribute && e.target.getAttribute('data-action') === 'import-label' && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); document.getElementById('import-file').click(); return;
  }
  if (!session) return;
  if (!document.getElementById('modal').hidden) return;
  if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key;
  if (k === 'Escape') { e.preventDefault(); closeSession(false); return; }
  if (session.phase === 'summary') return;
  var it = current();
  if (it.type === 'mcq' || it.type === 'scenario') {
    var idx = '1234'.indexOf(k); if (idx === -1) idx = 'abcd'.indexOf(k.toLowerCase());
    if (idx !== -1 && session.ui.picked === undefined) { e.preventDefault(); pick(idx); return; }
    if ((k === 'Enter' || k === ' ') && session.ui.picked !== undefined) { e.preventDefault(); nextItem(); return; }
  } else if (it.type === 'card') {
    if (k === ' ' || k === 'Enter') { if (!session.ui.flipped) { e.preventDefault(); flip(); } else if (k === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); rate('good'); } return; }
    var gi = '1234'.indexOf(k);
    if (gi !== -1 && session.ui.flipped) { e.preventDefault(); rate(['again', 'hard', 'good', 'easy'][gi]); }
  } else if (it.type === 'oral') {
    if ((k === ' ' || k === 'Enter') && !session.ui.revealed && e.target.tagName !== 'BUTTON') { e.preventDefault(); reveal(); return; }
    if (session.ui.revealed) {
      if (k === '1') { e.preventDefault(); rate('again'); }
      else if (k === '2' || k === '3') { e.preventDefault(); rate('good'); }
      else if (k === '4') { e.preventDefault(); rate('easy'); }
    }
  }
});
if (window.matchMedia) {
  try { window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme); } catch (e) { /* older Safari */ }
}

/* =========================================================
   Boot
   ========================================================= */
load();
applyTheme();
loadBank();
render();

/* expose a little for debugging / tests */
window.Recurrent = { gradeState: gradeState, newState: newState, orderSmart: orderSmart, STORE_KEY: STORE_KEY };
})();
</script>
</body>
